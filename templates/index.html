<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/index.css">
    <title>Happy Christmas</title>
</head>

<body>

    <div class="container-text">
        <div class="container-2">
            <h1 class="year-text">2026</h1>
            <h2 class="year-text-d">Feliz Ano<br>Novo!</h2>
        </div>
        <p class="description">Celebre o Natal e sinta a magia no ar.</p>
    </div>

    <div class="time-container">
        <div class="time">
            <h2 id="day">00</h2>
            <p>Dias</p>
        </div>
        <div class="time">
            <h2 id="hour">00</h2>
            <p>Horas</p>
        </div>
        <div class="time">
            <h2 id="minute">00</h2>
            <p>Minutos</p>
        </div>
        <div class="time">
            <h2 id="second">00</h2>
            <p>Segundos</p>
        </div>
    </div>

    <div class="new-year-text" id="new-year-text">
        <p>Bem-vindo, 2026! Um novo capítulo começa agora
            cheio de esperaça e novas oportunidades!
            lembre-se novo
            <span>Ano</span>
            novos
            <span>Hábitos</span>!
        </p>
    </div>

    <footer>
        <p>Developed by CRISNET</p>
    </footer>

    <script src="/static/scripts/scripts.js"></script>
</body>

</html>
