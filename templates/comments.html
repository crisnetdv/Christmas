<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commentários</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            color: #fff;
            background-color: #ff0000;

            height: 100dvh;
            display: flex;
            align-items: center;
            flex-direction: column;
            gap: 3rem;
            padding: 5rem 1rem;
        }

        section {
            width: 100%;
            padding: 0 8%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 500px;
        }

        .comment {
            width: 100%;
            color: #000;
            border-radius: 10px;
            padding: 10px;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            gap: .35rem;
        }

        .comment span {
            opacity: .6;
        }

    </style>

</head>

<body>

    <h1>Commentários</h1>

    <section id="container" class="container@">

    </section>

    <script>

        fetch("/comments")
        .then(response => response.json())
        .then(data => {
            data.forEach(comment => {
                const divComment = document.createElement("div");
                const spanCountry = document.createElement("span");
                const commentP = document.createElement("p");

                divComment.classList.add("comment")

                spanCountry.textContent = comment.country;
                commentP.textContent = comment.comment;

                divComment.appendChild(spanCountry);
                divComment.appendChild(commentP);
                document.getElementById("container").appendChild(divComment);
            });
        })

    </script>

</body>

</html>
